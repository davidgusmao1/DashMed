[functions.saude]
verify_jwt = true

# Conteúdos para mídias sociais (10/11/26). Todas exigem a sessão do usuário,
# com duas exceções que se conferem sozinhas:
# - conteudos-roteiro: cada passo chama o seguinte com a chave de serviço; a
#   função valida a sessão (auth.getUser) ou a chave de serviço (tempo
#   constante) em toda chamada, sem depender do formato da chave no gateway;
# - heygen-retorno: quem chama é a HeyGen; a função confere um token por vídeo
#   e o estado na API da HeyGen.
[functions.integracoes]
verify_jwt = true

[functions.conteudos-pesquisa]
verify_jwt = true

[functions.conteudos-roteiro]
verify_jwt = false

[functions.conteudos-video]
verify_jwt = true

[functions.heygen-retorno]
verify_jwt = false

# Contas (11/11/26): criar, link de primeiro acesso, papel, desativar/reativar.
# Exige a sessão de quem pede; a função confere se é admin do cliente ou da plataforma.
[functions.usuarios]
verify_jwt = true

# YouTube Seller (12/11/26). youtube-responder exige a sessão (quem publica é
# o médico). As outras duas se conferem sozinhas:
# - youtube-oauth: a volta do Google chega pelo navegador, sem JWT; a proteção
#   é o state (oauth_estados), de uso único e que expira em 15 min;
# - youtube-varrer: aceita a sessão (auth.getUser), a chave de serviço (passo
#   seguinte) ou o token do cron (x-dashmed-cron, DASHMED_CRON_TOKEN).
[functions.youtube-oauth]
verify_jwt = false

[functions.youtube-varrer]
verify_jwt = false

[functions.youtube-responder]
verify_jwt = true
